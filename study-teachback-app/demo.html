<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>体验示例 · 知而能讲</title><link rel="stylesheet" href="/style.css"></head>
<body class="demo-page">
<a class="skip" href="#main">跳到示例内容</a>
<aside class="sidebar" aria-label="工作区导航">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5c3-1.5 6-1.3 9 .5v14c-3-1.8-6-2-9-.5z M12 6c3-1.8 6-2 9-.5v14c-3-1.5-6-1.3-9 .5"/></svg><span>知而能讲</span></div>
  <nav id="globalNav">
    <a href="/" class="nav-item" aria-label="学习首页" title="学习首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z"/></svg><span>学习首页</span></a>
    
    <a class="nav-item active" href="/demo" aria-current="page" aria-label="免费示例" title="免费示例"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 12 8-12 8z"/></svg><span>免费示例</span></a>
  </nav>
  <button id="navToggle" class="nav-toggle" aria-controls="globalNav" aria-expanded="true" aria-label="收起侧栏" title="收起侧栏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
</aside>
<div class="app-shell">

<main id="main" tabindex="-1">
  <div class="demo-intro"><div><h1>试一节课</h1><p class="muted">预写示例 · 无需 API · 输入仅留在本页</p></div><button id="demoReset" class="quiet">重新体验</button></div>
  <div class="demo-topics" aria-label="选择示例"><button data-sample="0" class="chip" aria-pressed="true">数据结构 · 循环队列</button><button data-sample="1" class="chip" aria-pressed="false">统计学 · 条件概率</button></div>
  <ol class="journey demo-journey" aria-label="示例阶段"><li data-demo-step="0" aria-current="step"><span>1</span>读材料</li><li data-demo-step="1"><span>2</span>看讲解</li><li data-demo-step="2"><span>3</span>查反馈</li><li data-demo-step="3"><span>4</span>换个情境</li></ol>
  <div class="demo-layout">
    <aside class="card demo-source"><h2 id="demoTitle"></h2><p id="demoSource" class="prewrap"></p><h3>学习目标</h3><p id="demoGoal" class="muted"></p></aside>
    <section class="card demo-stage">
      <h2 id="demoHeading" tabindex="-1"></h2>
      <div id="demoRead"><p id="demoExplanation" class="demo-reading"></p><div class="demo-question"><strong>先想一想</strong><p id="demoThinking"></p></div></div>
      <div id="demoExplain" hidden><fieldset class="answer-choices"><legend class="sr-only">选择预设讲解</legend><label><input type="radio" name="exampleAnswer" value="0" checked><span><strong>讲解 A</strong><span id="answerA"></span></span></label><label><input type="radio" name="exampleAnswer" value="1"><span><strong>讲解 B</strong><span id="answerB"></span></span></label></fieldset></div>
      <div id="demoResult" hidden><div id="demoFindings"></div><div id="demoRepair" hidden><label for="demoRewrite">重讲这一点（示例不评价自由文字）</label><textarea id="demoRewrite" rows="3" maxlength="500" placeholder="写下修正后的解释…"></textarea><button id="demoUseRepair" class="quiet">采用预写重讲</button></div></div>
      <div id="demoPractice" hidden><p id="demoScenario" class="demo-reading"></p><div class="practice-choices"><button id="practiceA" class="quiet"></button><button id="practiceB" class="quiet"></button></div><p id="practiceFeedback" role="status"></p><details id="demoTrail" hidden><summary>查看这轮学习经过</summary><p id="demoTrailText" class="prewrap"></p></details><a class="button-link" href="/">开始自己的学习</a></div>
      <div class="demo-controls"><button id="demoBack" class="quiet" hidden>上一步</button><button id="demoNext">看看怎么讲</button></div>
    </section>
  </div>

</main>
</div>
<script type="module" src="/demo.mjs"></script>
<script type="module" src="/navigation.mjs"></script>
</body></html>
